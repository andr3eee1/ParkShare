  <rect x="688" y="780" width="56" height="4" rx="2" fill="#009967"/>
  <text x="688" y="858" font-family="Space Grotesk, Inter, sans-serif" font-weight="700" font-size="84" fill="#101826">Aa</text>
  <text x="800" y="820" font-family="Space Grotesk, Inter, sans-serif" font-weight="600" font-size="24" fill="#101826">Space Grotesk</text>
  <text x="800" y="848" font-family="Inter, sans-serif" font-weight="500" font-size="15" fill="#62748E">Display · headings · numbers</text>
  <text x="800" y="872" font-family="Inter, sans-serif" font-weight="500" font-size="15" fill="#62748E">500 Medium · 600 SemiBold · 700 Bold</text>
  <text x="688" y="984" font-family="Inter, sans-serif" font-weight="400" font-size="84" fill="#101826">Aa</text>
  <text x="800" y="946" font-family="Space Grotesk, Inter, sans-serif" font-weight="600" font-size="24" fill="#101826">Inter</text>
