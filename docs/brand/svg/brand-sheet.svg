  <text x="688" y="248" font-family="Space Grotesk, Inter, sans-serif" font-weight="600" font-size="26" fill="#101826">Palette</text>
  <rect x="688" y="264" width="56" height="4" rx="2" fill="#009967"/>
  <text x="688" y="306" font-family="Inter, sans-serif" font-weight="500" font-size="17" fill="#62748E">Light-first, trust-green identity.</text>

