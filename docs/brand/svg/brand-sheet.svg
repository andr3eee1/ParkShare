<?xml version="1.0" encoding="UTF-8"?>
<!--
  ParkShare · Brand Sheet v1.0 (1920×1080)
  Overview: mark, variants, palette, typography, lockups, motto.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="ParkShare brand sheet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#009967"/>
      <stop offset="1" stop-color="#006552"/>
    </linearGradient>

    <g id="markColor">
      <rect x="0" y="0" width="13" height="62" rx="6" fill="#101826"/>
      <path d="M 15 0 L 15 38 A 19 19 0 0 0 23.95 35.76 L 23.95 2.24 A 19 19 0 0 0 15 0 Z" fill="#009967"/>
      <path d="M 25.05 2.87 L 25.05 35.13 A 19 19 0 0 0 25.05 2.87 Z" fill="#006552"/>
    </g>
    <g id="markMono">
      <rect x="0" y="0" width="13" height="62" rx="6" fill="#101826"/>
      <path d="M 15 0 L 15 38 A 19 19 0 0 0 23.95 35.76 L 23.95 2.24 A 19 19 0 0 0 15 0 Z" fill="#101826"/>
      <path d="M 25.05 2.87 L 25.05 35.13 A 19 19 0 0 0 25.05 2.87 Z" fill="#101826"/>
    </g>
    <g id="markWhite">
      <rect x="0" y="0" width="13" height="62" rx="6" fill="#FFFFFF"/>
      <path d="M 15 0 L 15 38 A 19 19 0 0 0 23.95 35.76 L 23.95 2.24 A 19 19 0 0 0 15 0 Z" fill="#FFFFFF"/>
      <path d="M 25.05 2.87 L 25.05 35.13 A 19 19 0 0 0 25.05 2.87 Z" fill="#FFFFFF"/>
    </g>
    <g id="markSolidWhite">
      <rect x="0" y="0" width="13" height="62" rx="6" fill="#FFFFFF"/>
      <path d="M 15 0 A 19 19 0 0 1 15 38 Z" fill="#FFFFFF"/>
    </g>

