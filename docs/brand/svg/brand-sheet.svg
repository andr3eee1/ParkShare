  <g font-family="Inter, sans-serif">
    <rect x="688" y="360" width="118" height="118" rx="16" fill="#009967"/>
    <rect x="812" y="360" width="118" height="118" rx="16" fill="#006552"/>
    <rect x="936" y="360" width="118" height="118" rx="16" fill="#D7F8E8" stroke="#E5EAF0" stroke-width="2"/>
    <rect x="1060" y="360" width="118" height="118" rx="16" fill="#101826"/>
    <text x="747" y="500" text-anchor="middle" font-weight="600" font-size="15" fill="#101826">Emerald 500</text>
    <text x="747" y="522" text-anchor="middle" font-weight="500" font-size="13" fill="#62748E">Primary</text>
    <text x="871" y="500" text-anchor="middle" font-weight="600" font-size="15" fill="#101826">Emerald 700</text>
    <text x="871" y="522" text-anchor="middle" font-weight="500" font-size="13" fill="#62748E">Deep green</text>
    <text x="995" y="500" text-anchor="middle" font-weight="600" font-size="15" fill="#101826">Emerald 100</text>
    <text x="995" y="522" text-anchor="middle" font-weight="500" font-size="13" fill="#62748E">Tint / accent</text>
    <text x="1119" y="500" text-anchor="middle" font-weight="600" font-size="15" fill="#101826">Ink</text>
    <text x="1119" y="522" text-anchor="middle" font-weight="500" font-size="13" fill="#62748E">Text &amp; stem</text>
  </g>
  <!-- swatches row 2 -->
  <g font-family="Inter, sans-serif">
    <rect x="688" y="540" width="118" height="118" rx="16" fill="#F9FAFB" stroke="#E5EAF0" stroke-width="2"/>
    <rect x="812" y="540" width="118" height="118" rx="16" fill="#62748E"/>
    <rect x="936" y="540" width="118" height="118" rx="16" fill="#0F766E"/>
    <rect x="1060" y="540" width="118" height="118" rx="16" fill="#D97706"/>
    <text x="747" y="680" text-anchor="middle" font-weight="600" font-size="15" fill="#101826">Paper</text>
    <text x="747" y="702" text-anchor="middle" font-weight="500" font-size="13" fill="#62748E">Background</text>
    <text x="871" y="680" text-anchor="middle" font-weight="600" font-size="15" fill="#101826">Slate</text>
    <text x="871" y="702" text-anchor="middle" font-weight="500" font-size="13" fill="#62748E">Muted text</text>
    <text x="995" y="680" text-anchor="middle" font-weight="600" font-size="15" fill="#101826">Teal</text>
    <text x="995" y="702" text-anchor="middle" font-weight="500" font-size="13" fill="#62748E">Civic / trust</text>
    <text x="1119" y="680" text-anchor="middle" font-weight="600" font-size="15" fill="#101826">Amber</text>
    <text x="1119" y="702" text-anchor="middle" font-weight="500" font-size="13" fill="#62748E">Warning</text>
