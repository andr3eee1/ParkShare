  </g>
  <text x="196" y="92" font-family="Space Grotesk, Inter, sans-serif" font-weight="700" font-size="72" fill="#FFFFFF" style="letter-spacing:0.6px">ParkShare</text>
  <text x="198" y="136" font-family="Inter, sans-serif" font-weight="500" font-size="22" fill="#AFC3D9" style="letter-spacing:2px">BRAND GUIDELINES · V1.0</text>
  <text x="1860" y="96" text-anchor="end" font-family="Space Grotesk, Inter, sans-serif" font-weight="600" font-size="34" fill="#FFFFFF">Park smarter. Share more.</text>
  <text x="1860" y="134" text-anchor="end" font-family="Inter, sans-serif" font-weight="500" font-size="18" fill="#AFC3D9" style="letter-spacing:1.5px">OCTOBER 2026 · DOCS/BRAND</text>

  <!-- ===== Column A · The Mark ===== -->
  <text x="60" y="248" font-family="Space Grotesk, Inter, sans-serif" font-weight="600" font-size="26" fill="#101826">The Mark · Share-P</text>
  <rect x="60" y="264" width="64" height="4" rx="2" fill="#009967"/>
  <text x="60" y="306" font-family="Inter, sans-serif" font-weight="500" font-size="17" fill="#62748E">The parking “P” split into two interlocking halves —</text>
  <text x="60" y="328" font-family="Inter, sans-serif" font-weight="500" font-size="17" fill="#62748E">two parties, one spot. Stem = ink.</text>

  <rect x="60" y="360" width="560" height="510" rx="28" fill="#FFFFFF" stroke="#E5EAF0" stroke-width="2"/>
  <g transform="translate(217.6 391.8) scale(7.2)">
    <use href="#markColor"/>
  </g>
  <text x="340" y="910" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="16" fill="#62748E">Two-tone emerald — for light surfaces</text>

  <!-- variant chips -->
  <rect x="60" y="936" width="150" height="110" rx="16" fill="#101826"/>
  <g transform="translate(106.95 939.9) scale(1.65)"><use href="#markWhite"/></g>
  <rect x="226" y="936" width="150" height="110" rx="16" fill="#FFFFFF" stroke="#E5EAF0" stroke-width="2"/>
  <g transform="translate(272.95 939.9) scale(1.65)"><use href="#markMono"/></g>
  <rect x="392" y="936" width="150" height="110" rx="16" fill="url(#bg)"/>
  <g transform="translate(438.95 939.9) scale(1.65)"><use href="#markSolidWhite"/></g>
  <text x="135" y="1072" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#62748E">On dark</text>
  <text x="301" y="1072" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#62748E">On light</text>
  <text x="467" y="1072" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#62748E">Gradient</text>

