  <text x="1312" y="306" font-family="Inter, sans-serif" font-weight="500" font-size="17" fill="#62748E">One mark, every size, two languages.</text>

  <rect x="1312" y="360" width="520" height="150" rx="20" fill="#FFFFFF" stroke="#E5EAF0" stroke-width="2"/>
  <use href="#lockHC" transform="translate(1338 372.6) scale(0.52)"/>

  <rect x="1312" y="540" width="520" height="150" rx="20" fill="#101826"/>
  <use href="#lockHW" transform="translate(1338 552.6) scale(0.52)"/>

  <text x="1312" y="726" font-family="Inter, sans-serif" font-weight="500" font-size="15" fill="#62748E">Light — default &#160;&#183;&#160; Dark — on ink &amp; photos</text>

  <rect x="1312" y="760" width="230" height="300" rx="20" fill="#FFFFFF" stroke="#E5EAF0" stroke-width="2"/>
  <use href="#lockStacked" transform="translate(1326.2 798.4) scale(0.36)"/>

  <text x="1580" y="812" font-family="Space Grotesk, Inter, sans-serif" font-weight="600" font-size="22" fill="#101826">Motto</text>
