  <text x="1580" y="904" font-family="Space Grotesk, Inter, sans-serif" font-weight="600" font-size="40" fill="#101826">Share more.</text>
  <text x="1580" y="968" font-family="Inter, sans-serif" font-weight="500" font-size="16" fill="#62748E">Clear space — one bowl radius on all sides.</text>
  <text x="1580" y="992" font-family="Inter, sans-serif" font-weight="500" font-size="16" fill="#62748E">Minimums — 16 px symbol · 120 px lockup.</text>
