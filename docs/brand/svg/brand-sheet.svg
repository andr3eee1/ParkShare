        </g>
        <text x="190" y="148" font-family="Space Grotesk, Inter, sans-serif" font-weight="700" font-size="78" fill="#101826" style="letter-spacing:0.6px">ParkShare</text>
        <text x="192" y="199" font-family="Inter, sans-serif" font-weight="500" font-size="21" fill="#62748E" style="letter-spacing:2.5px">Park smarter. Share more.</text>
      </g>
    </g>
    <g id="lockHW">
      <g transform="translate(0 0)">
        <g transform="translate(48 39.4) scale(2.6)">
          <use href="#markWhite"/>
        </g>
        <text x="190" y="148" font-family="Space Grotesk, Inter, sans-serif" font-weight="700" font-size="78" fill="#FFFFFF" style="letter-spacing:0.6px">ParkShare</text>
        <text x="192" y="199" font-family="Inter, sans-serif" font-weight="500" font-size="21" fill="#AFC3D9" style="letter-spacing:2.5px">Park smarter. Share more.</text>
      </g>
    </g>
